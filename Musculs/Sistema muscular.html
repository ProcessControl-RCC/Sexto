<title>Sistema muscular</title>

<style>
/* Layout: one-screen app — the worksheet's two figures (front / back) fill the board, a study panel docks right (stacks below on phones). */
:root{
  --bg:#ece7e3; --panel:#fdfbf9; --ink:#2a1f1d; --muted:#6e605b; --line:#ddd2cb;
  --board:#f7f2ee; --skin:#ecdccf; --skin-line:#d6c1b1; --muscle:#b8526a; --muscle-hot:#93354d; --plain:#dcb3ad;
  --accent:#0f6e8c; --accent-ink:#ffffff; --ok:#2c8a4b; --bad:#c23e2b; --bad-fill:#3d3331; --near:#b86a00;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141112; --panel:#1d191a; --ink:#efe6e3; --muted:#b0a19c; --line:#352d2d;
  --board:#1a1617; --skin:#3a302d; --skin-line:#4e423e; --muscle:#d77a91; --muscle-hot:#f2a3b6; --plain:#5e4448;
  --accent:#5fc3e3; --accent-ink:#06222c; --ok:#5ccf85; --bad:#ff7d68; --bad-fill:#cfc3bf; --near:#f2b257; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141112; --panel:#1d191a; --ink:#efe6e3; --muted:#b0a19c; --line:#352d2d;
  --board:#1a1617; --skin:#3a302d; --skin-line:#4e423e; --muscle:#d77a91; --muscle-hot:#f2a3b6; --plain:#5e4448;
  --accent:#5fc3e3; --accent-ink:#06222c; --ok:#5ccf85; --bad:#ff7d68; --bad-fill:#cfc3bf; --near:#f2b257; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:12px;padding-block:12px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(22px,3vw,30px);line-height:1;letter-spacing:-.01em}
h1 small{font-weight:600;font-size:.5em;color:var(--muted);letter-spacing:0;margin-left:6px}
.modes{display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.modes button{border:0;background:none;padding:8px 12px;border-radius:9px;font-weight:700;color:var(--muted)}
.modes button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.modes button:hover:not([aria-selected="true"]){color:var(--ink);background:var(--bg)}
.score{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;display:flex;gap:14px}
.score .ok{color:var(--ok)} .score .bad{color:var(--bad)}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:12px;min-height:0}
.board{position:relative;min-height:0;border-radius:14px;overflow:hidden;background:var(--board);border:1px solid var(--line)}
#body{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.toast{position:absolute;left:50%;top:12px;transform:translate(-50%,-6px);opacity:0;transition:opacity .2s,transform .2s;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:700;pointer-events:none;white-space:nowrap;max-width:80%;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{color:var(--ok);border-color:var(--ok)} .toast.bad{color:var(--bad);border-color:var(--bad)}

/* figura */
.sil{fill:var(--skin);stroke:var(--skin-line);stroke-width:1.5}
.plain{fill:var(--plain);stroke:var(--skin);stroke-width:3}
.deco{fill:none;stroke:var(--skin);stroke-width:3;pointer-events:none}
.view-t{font-family:var(--f-display);font-weight:600;font-size:17px;fill:var(--muted);text-anchor:middle;letter-spacing:.12em;text-transform:uppercase}
.ms{cursor:pointer}
.ms path{fill:var(--muscle);stroke:var(--skin);stroke-width:3;transition:fill .15s}
.ms:hover path,.ms.hot path{fill:var(--muscle-hot)}
.ms.off{pointer-events:none}
.ms.off path{fill:var(--plain)}
.ms.target path{animation:pulse .9s ease-in-out infinite alternate}
.ms.done path,.ms.found path{fill:var(--ok)}
.ms.flash-ok path{fill:var(--ok)}
.ms.flash-bad path{fill:var(--bad-fill)}
@keyframes pulse{from{fill:var(--muscle)}to{fill:var(--accent)}}
.lb{pointer-events:none;opacity:0;transition:opacity .2s}
.lb text{font-size:19px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--board);stroke-width:4px;stroke-linejoin:round}
.lb line{stroke:var(--ink);stroke-width:1.4}
.lb circle{fill:var(--ink)}
.study.labels .lb:not(.off),.lb.reveal,.lb.done{opacity:1}
.lb.done text{fill:var(--ok)}
.lb.done line,.lb.done circle{stroke:var(--ok);fill:var(--ok)}

/* panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.ph{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.ph h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.15;text-wrap:balance}
.ph p{margin:0;color:var(--muted);font-size:13.5px}
.pb{padding:12px 16px 16px;overflow:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:150px}
.field label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
select,input[type=text]{font:inherit;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.btn{border:1px solid var(--line);background:var(--bg);padding:8px 14px;border-radius:9px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:hover{border-color:var(--accent)}
.toggle{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}

.sec h3{margin:0 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:8px;color:var(--muscle-hot)}
.sec h3 .n{color:var(--muted);font-weight:400;letter-spacing:0;text-transform:none}
.items{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:8px}
.item:hover,.item.active{background:var(--bg)}
.item .nm{flex:1;min-width:0;font-weight:700}
.item .note{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.pips{display:flex;gap:3px}
.pips i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--ok)}

.progress{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.progress span{display:block;height:100%;background:var(--ok);transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--panel);font-weight:700;font-size:14px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.chip.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.chip.shake{animation:shake .35s}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;box-shadow:0 8px 20px rgb(0 0 0 / .25);cursor:grabbing}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

.ask{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.ask .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ask .q{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.15;text-wrap:balance}
.ask .q.fn{font-size:20px}
.fb{font-weight:700;min-height:1.4em}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)} .fb.near{color:var(--near)}
.fb small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.tform{display:flex;gap:8px}
.tform input{font-size:18px;font-weight:700;padding:10px 12px}
.hint{font-family:ui-monospace,Consolas,monospace;font-size:17px;letter-spacing:.25em;font-weight:700}
.summary{display:flex;flex-direction:column;gap:10px}
.big{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.missed{display:flex;flex-wrap:wrap;gap:6px}
.missed span{font-size:13px;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--bad) 12%,var(--bg));color:var(--bad);font-weight:700}
.muted{color:var(--muted);font-size:13px}

.recall{display:flex;flex-direction:column;gap:6px}
.recall .slot{display:flex;align-items:center;gap:8px}
.recall .slot input{flex:1}
.recall .slot .mk{width:20px;text-align:center;font-weight:700}
.recall input.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--bg))}
.recall input.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--bg))}
.recall .why{font-size:12.5px;color:var(--muted);margin-left:28px}
.recall .why:empty{display:none}
.sol{font-size:13px;color:var(--muted)}

@media (max-width:820px){
  html,body{height:auto}
  .app{height:auto}
  .stage{grid-template-columns:1fr}
  .board{height:auto;aspect-ratio:1100/800;max-width:100%}
  .pb{overflow:visible}
  .score{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

    </div>

</div>
<div id="ghost" class="chip ghost" hidden></div>

<script>
const VIEWS=[{k:'davant',name:'Vista de davant',cx:360,labX:205,side:-1},{k:'darrere',name:'Vista de darrere',cx:740,labX:895,side:1}];
// d: forma del múscul de la meitat dreta de la figura (x=0 és el centre del cos); es dibuixa també en mirall.
// at: punt on apunta la fletxa · ly: alçada de l'etiqueta · fn: per a què serveix
const MUSCLES=[
  {id:'pectoral',n:'Pectoral',v:'davant',alias:['pectorals'],at:[55,210],ly:222,
    fn:'Mou els braços cap endavant, per exemple quan fas una abraçada o empenys una porta.',
    d:'M6,176 C40,166 80,170 100,188 C102,214 86,240 56,246 C30,250 10,242 6,226 Z'},
  {id:'deltoide',n:'Deltoide',v:'davant',alias:['deltoides'],at:[122,198],ly:168,
    fn:'Cobreix l’espatlla i aixeca el braç cap al costat i cap amunt.',
    d:'M100,166 C126,166 142,192 140,232 C126,226 110,214 101,192 Z'},
  {id:'biceps',n:'Bíceps',v:'davant',alias:['bicep'],at:[121,282],ly:282,
    fn:'Doblega el braç pel colze, per exemple quan aixeques una bossa.',
    d:'M108,236 C126,238 137,254 135,300 C131,318 119,326 110,320 C103,292 103,258 108,236 Z'},
  {id:'abdominals',n:'Abdominals',v:'davant',alias:['abdominal','abdomen'],at:[26,330],ly:340,
    fn:'Protegeixen els òrgans de la panxa i doblen el tronc cap endavant.',
    d:'M6,254 L50,252 C54,300 52,360 46,420 L6,426 Z'},
  {id:'flexors',n:'Flexors de la mà',v:'davant',alias:['flexors','flexor de la ma','flexors de la mano','flexor'],at:[123,385],ly:400,two:true,
    fn:'Tanquen la mà i doblen el canell, per exemple per agafar un objecte.',
    d:'M107,342 L129,340 C137,370 142,402 141,436 L128,437 C120,406 111,376 107,342 Z'},
  {id:'quadriceps',n:'Quadríceps',v:'davant',alias:['quadricep','cuadriceps'],at:[46,510],ly:510,
    fn:'Estira la cama pel genoll. El fas servir per xutar una pilota o pujar escales.',
    d:'M12,466 L80,442 C88,492 83,545 70,578 L28,578 C19,540 13,502 12,466 Z'},
  {id:'tibial',n:'Tibial',v:'davant',alias:['tibial anterior','tibials'],at:[49,655],ly:665,
    fn:'Aixeca la punta del peu quan camines.',
    d:'M38,602 L60,600 C64,640 61,680 55,716 L44,716 C39,680 35,640 38,602 Z'},

  {id:'trapezi',n:'Trapezi',v:'darrere',alias:['trapezis','trapecio','trapeci'],at:[30,178],ly:165,
    fn:'Mou les espatlles i el coll, per exemple quan arronses les espatlles.',
    d:'M0,126 L22,130 C34,156 70,162 99,170 C70,190 40,226 0,306 Z'},
  {id:'dorsal',n:'Dorsal',v:'darrere',alias:['dorsals','dorsal ample'],at:[68,300],ly:322,
    fn:'Porta els braços cap avall i cap enrere, com quan neditzes o t’enfiles.',
    d:'M8,300 C30,248 70,224 106,220 C104,270 84,330 66,386 L12,402 Z'},
  {id:'triceps',n:'Tríceps',v:'darrere',alias:['tricep'],at:[122,280],ly:250,
    fn:'Estira el braç pel colze, per exemple quan llances una pilota.',
    d:'M104,234 C122,230 137,248 137,290 C135,315 127,330 112,330 C104,300 101,262 104,234 Z'},
  {id:'extensors',n:'Extensors de la mà',v:'darrere',alias:['extensors','extensor de la ma','extensores de la mano','extensor'],at:[124,388],ly:400,two:true,
    fn:'Obren la mà i estiren els dits i el canell.',
    d:'M107,342 L129,340 C137,370 142,402 141,436 L128,437 C120,406 111,376 107,342 Z'},
  {id:'glutis',n:'Glutis',v:'darrere',alias:['gluti','gluteus','glutis','gluteo','gluteos','glutic'],at:[46,462],ly:470,
    fn:'Mouen la cuixa cap enrere i ens ajuden a caminar, córrer i aixecar-nos.',
    d:'M3,426 C30,404 76,410 87,442 C93,476 70,506 40,506 C15,506 3,490 3,470 Z'},
  {id:'isquiotibials',n:'Isquiotibials',v:'darrere',alias:['isquiotibial','isquiotibiales'],at:[44,545],ly:545,
    fn:'Doblega la cama pel genoll, per exemple quan fas un pas o un salt.',
    d:'M11,512 L78,508 C84,536 77,562 68,586 L24,586 C16,562 11,538 11,512 Z'},
  {id:'bessons',n:'Bessons',v:'darrere',alias:['besso','bessó','gastrocnemi','gemelos','bessons de la cama'],at:[49,640],ly:640,
    fn:'Aixequen el taló, per exemple quan et poses de puntetes.',
    d:'M22,596 C40,590 72,592 74,616 C76,650 66,680 56,692 L40,692 C26,672 18,640 22,596 Z'},
];
// silueta (meitat dreta) i músculs sense nom per donar forma
const SIL=[
  'M0,148 L26,148 C40,160 70,158 100,166 C130,172 142,206 140,250 C139,290 134,318 131,338 C139,370 147,410 147,440 L126,442 C118,410 108,372 104,338 C100,300 101,262 108,232 L112,232 C108,280 90,330 66,382 C72,402 86,418 88,442 C92,486 88,542 76,586 C82,632 78,682 64,726 L74,762 L30,762 L36,726 C26,682 18,632 20,586 C14,540 7,492 4,458 L0,458 Z',
];
const HEAD={rx:33,ry:43,cy:84};
const NECK='M-22,116 L22,116 L26,152 L-26,152 Z';
const HAND='M126,440 C120,456 122,486 132,498 C140,506 152,496 152,480 C152,464 150,450 147,440 Z';
const PLAIN={
  davant:['M14,382 C30,378 44,382 50,425 L10,430 Z'],
  darrere:['M100,166 C126,166 142,192 140,232 C126,226 110,214 101,192 Z','M38,602 L58,600 C62,640 60,680 54,716 L44,716 C40,680 36,640 38,602 Z'],
};
const BY=Object.fromEntries(MUSCLES.map(d=>[d.id,d]));
const vName=k=>VIEWS.find(v=>v.k===k).name;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);

/* ---------- comparació de respostes escrites ---------- */
const deacc=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
const norm=s=>deacc(String(s).toLowerCase().trim()).replace(/^(el|la|els|les|l')\s*/,'').replace(/^musculs?\s+(de\s+|del\s+|dels\s+)?/,'').replace(/[^a-z]/g,'');
const names=d=>[d.n,...(d.alias||[])].map(norm);
function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function check(d,v){
  const nv=norm(v);
  if(!nv)return {empty:true};
  if(names(d).includes(nv)){
    let note='';
    if(nv!==norm(d.n))note=`Al full s’escriu «${d.n}».`;
    else if(v.trim().toLowerCase().replace(/\s+/g,' ')!==d.n.toLowerCase())note=`Fixa’t en com s’escriu: «${d.n}».`;
    return {ok:true,note};
  }
  const other=MUSCLES.find(r=>r!==d&&names(r).includes(nv));
  if(other)return {other};
  const lim=nv.length<=5?1:2;
  if(names(d).some(x=>lev(nv,x)<=lim))return {near:true};
  return {};
}

/* ---------- progrés guardat en aquest navegador ---------- */
const KEY='musculs-v1';
let stats={};
try{stats=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){stats={}}
function record(id,ok){
  const s=stats[id]||(stats[id]={ok:0,ko:0});
  ok?s.ok++:s.ko++;
  try{localStorage.setItem(KEY,JSON.stringify(stats))}catch(e){}
}
const level=id=>{const s=stats[id];return s?Math.max(0,Math.min(3,s.ok-s.ko)):0};

/* ---------- dibuix de les dues figures ---------- */
const NS='http://www.w3.org/2000/svg';
const svg=$('#body');
const el=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e};
const both=(parent,d,cls)=>[1,-1].forEach(s=>el('path',{d,class:cls,transform:`scale(${s},1)`},parent));
VIEWS.forEach(v=>{
  const g=el('g',{transform:`translate(${v.cx},0)`},svg);v.g=g;
  el('text',{x:0,y:24,class:'view-t'},g).textContent=v.name;
  SIL.forEach(d=>both(g,d,'sil'));
  el('path',{d:NECK,class:'sil'},g);
  el('ellipse',{cx:0,cy:HEAD.cy,rx:HEAD.rx,ry:HEAD.ry,class:'sil'},g);
  both(g,HAND,'sil');
  PLAIN[v.k].forEach(d=>both(g,d,'plain'));
});
MUSCLES.forEach(d=>{
  const v=VIEWS.find(x=>x.k===d.v);
  const g=el('g',{class:'ms','data-id':d.id},v.g);
  both(g,d.d,'');
  el('title',{},g).textContent='';
  d.ms=g;
});
// el trapezi queda per sobre del dorsal
BY.trapezi.ms.parentNode.appendChild(BY.trapezi.ms);
// línies dels abdominals (com una rajola)
const davG=VIEWS[0].g;
[292,336,380].forEach(y=>el('path',{d:`M-50,${y} L50,${y}`,class:'deco'},davG));
// etiquetes amb fletxa, com al full
MUSCLES.forEach(d=>{
  const v=VIEWS.find(x=>x.k===d.v);
  const ax=v.cx+v.side*d.at[0],ay=d.at[1];
  const g=el('g',{class:'lb','data-id':d.id},svg);
  const anchor=v.side<0?'end':'start';
  const t=el('text',{x:v.labX,y:d.ly,'text-anchor':anchor},g);
  const parts=d.two?[d.n.split(' ')[0],d.n.split(' ').slice(1).join(' ')]:[d.n];
  parts.forEach((p,i)=>{const ts=el('tspan',{x:v.labX,dy:i?22:0},t);ts.textContent=p});
  const lx=v.labX-v.side*-8;
  el('line',{x1:v.labX+(v.side<0?8:-8),y1:d.ly-6,x2:ax,y2:ay},g);
  el('circle',{cx:ax,cy:ay,r:3.5},g);
  d.lb=g;
});
const cls=(d,c,on)=>{d.ms.classList.toggle(c,on);d.lb.classList.toggle(c,on)};

/* ---------- utilitats d'interfície ---------- */
const panel=$('#panel'),scoreEl=$('#score'),toastEl=$('#toast');
let toastT;
function toast(msg,kind){toastEl.textContent=msg;toastEl.className=`toast show ${kind||''}`;clearTimeout(toastT);toastT=setTimeout(()=>toastEl.className='toast',1600)}
function flash(d,kind){const c='flash-'+kind;cls(d,c,true);setTimeout(()=>cls(d,c,false),900)}
function clearMarks(){MUSCLES.forEach(d=>['done','reveal','target','hot','found','flash-ok','flash-bad'].forEach(c=>cls(d,c,false)))}
let poolV='all';
const pool=()=>MUSCLES.filter(d=>poolV==='all'||d.v===poolV);
function setPool(all){const ids=new Set((all?MUSCLES:pool()).map(d=>d.id));MUSCLES.forEach(d=>cls(d,'off',!ids.has(d.id)))}
function poolSelect(){
  return `<div class="field"><label for="pool">Què vols practicar?</label><select id="pool">
    <option value="all"${poolV==='all'?' selected':''}>Tots (14 músculs)</option>
    ${VIEWS.map(v=>`<option value="${v.k}"${poolV===v.k?' selected':''}>${v.name} (${MUSCLES.filter(d=>d.v===v.k).length})</option>`).join('')}
  </select></div>`;
}
function bindPool(){const s=$('#pool');if(s)s.onchange=()=>{poolV=s.value;start(mode)}}

/* ---------- modes ---------- */
let mode='estudia';
let onMuscle=()=>{};
MUSCLES.forEach(d=>d.ms.addEventListener('click',()=>onMuscle(d)));
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>start(b.dataset.mode));

function start(m){
  mode=m;
  document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===m));
  svg.classList.remove('study','labels');
  document.onkeydown=null;
  clearMarks();setPool(m==='memoria');scoreEl.innerHTML='';onMuscle=()=>{};
  ({estudia:study,colloca:placeGame,troba:findGame,escriu:typeGame,serveix:fnGame,memoria:recallGame})[m]();
}

/* Estudia */
let hideLabels=false;
function study(){
  svg.classList.add('study');svg.classList.toggle('labels',!hideLabels);
  const views=VIEWS.filter(v=>poolV==='all'||v.k===poolV);
  panel.innerHTML=`<div class="ph"><h2>Estudia els músculs</h2>
    <p>Toca un múscul del dibuix o de la llista per veure com es diu i per a què serveix.</p>
    <div class="row">${poolSelect()}</div>
    <label class="toggle"><input type="checkbox" id="hide"${hideLabels?' checked':''}> Amaga els noms del dibuix</label></div>
    <div class="pb">${views.map(v=>{const its=MUSCLES.filter(d=>d.v===v.k);return `<section class="sec">
      <h3><span>${v.name}</span><span class="n">${its.length} músculs</span></h3>
      <ul class="items">${its.map(d=>`<li><button class="item" data-id="${d.id}">
        <span class="nm">${esc(d.n)}<span class="note">${esc(d.fn)}</span></span>
        <span class="pips" title="Encerts a les proves">${[0,1,2].map(i=>`<i class="${i<level(d.id)?'on':''}"></i>`).join('')}</span>
      </button></li>`).join('')}</ul></section>`}).join('')}
      <p class="muted">Tenim cada múscul a les dues bandes del cos: per això al dibuix es marquen tots dos.</p>
      <div class="row"><button class="btn" id="reset-stats">Esborra el progrés</button></div>
    </div>`;
  bindPool();
  $('#hide').onchange=e=>{hideLabels=e.target.checked;svg.classList.toggle('labels',!hideLabels)};
  const focus=d=>{
    clearMarks();cls(d,'target',true);cls(d,'reveal',true);
    panel.querySelectorAll('.item').forEach(b=>b.classList.toggle('active',b.dataset.id===d.id));
  };
  panel.querySelectorAll('.item').forEach(b=>b.onclick=()=>focus(BY[b.dataset.id]));
  onMuscle=d=>{focus(d);const b=panel.querySelector(`.item[data-id="${d.id}"]`);b&&b.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'})};
  let armed=false;
  $('#reset-stats').onclick=e=>{
    if(!armed){armed=true;e.target.textContent='Segur? Torna a tocar';return}
    stats={};try{localStorage.removeItem(KEY)}catch(_){ }study();
  };
}

/* Col·loca (arrossega els noms sobre els músculs) */
function placeGame(){
  const items=pool();let placed=new Set(),errors=0,selected=null;
  const sc=()=>scoreEl.innerHTML=`<span class="ok">✓ ${placed.size}/${items.length}</span><span class="bad">✗ ${errors}</span>`;
  const render=()=>{
    const left=shuffle(items.filter(d=>!placed.has(d.id)));sc();
    panel.innerHTML=`<div class="ph"><h2>Col·loca els noms</h2>
      <p>Arrossega cada nom fins al seu múscul. També pots tocar un nom i després tocar el múscul.</p>
      <div class="row">${poolSelect()}</div>
      <div class="progress" aria-hidden="true"><span style="width:${placed.size/items.length*100}%"></span></div></div>
      <div class="pb">${left.length?`<div class="chips">${left.map(d=>`<span class="chip" data-id="${d.id}" role="button" tabindex="0">${esc(d.n)}</span>`).join('')}</div>`
        :`<div class="summary"><span class="eyebrow">Dibuix complet</span><div class="big">${items.length}/${items.length}</div>
          <p>${errors===0?'Cap error. Perfecte!':`Ho has aconseguit amb ${errors} ${errors===1?'error':'errors'}.`}</p>
          <div class="row"><button class="btn primary" id="again">Torna-hi</button></div></div>`}
        <p class="muted">Compte: alguns músculs només es veuen de davant i d’altres només de darrere.</p></div>`;
    bindPool();
    const again=$('#again');if(again)again.onclick=()=>start('colloca');
    panel.querySelectorAll('.chip').forEach(bindChip);
  };
  const tryPlace=(d,target,chipEl)=>{
    if(!target)return;
    if(target.id===d.id){
      placed.add(d.id);record(d.id,true);cls(d,'done',true);flash(d,'ok');
      toast(`Correcte: ${d.n}`,'ok');selected=null;render();
    }else if(placed.has(target.id)){toast('Aquest múscul ja té el seu nom');}
    else{errors++;record(d.id,false);flash(target,'bad');toast(`Aquí no hi va ${d.n}`,'bad');
      if(chipEl){chipEl.classList.remove('shake');void chipEl.offsetWidth;chipEl.classList.add('shake')}
      sc();}
  };
  const muscleAt=(x,y)=>{const e=document.elementFromPoint(x,y);const g=e&&e.closest&&e.closest('.ms');return g&&!g.classList.contains('off')?BY[g.dataset.id]:null};
  const ghost=$('#ghost');
  function bindChip(c){
    const d=BY[c.dataset.id];let sx,sy,drag=false,hot=null;
    const setHot=n=>{if(n!==hot){hot&&cls(hot,'hot',false);hot=n;hot&&cls(hot,'hot',true)}};
    c.onpointerdown=e=>{e.preventDefault();sx=e.clientX;sy=e.clientY;drag=false;c.setPointerCapture(e.pointerId)};
    c.onpointermove=e=>{
      if(sx==null)return;
      if(!drag&&Math.hypot(e.clientX-sx,e.clientY-sy)>6){drag=true;ghost.innerHTML=c.innerHTML;ghost.hidden=false;c.style.opacity=.35}
      if(drag){ghost.style.transform=`translate(${e.clientX-ghost.offsetWidth/2}px,${e.clientY-ghost.offsetHeight-14}px)`;setHot(muscleAt(e.clientX,e.clientY))}
    };
    c.onpointerup=e=>{
      if(sx==null)return;sx=null;
      if(drag){ghost.hidden=true;c.style.opacity='';setHot(null);tryPlace(d,muscleAt(e.clientX,e.clientY),c)}
      else{selected=selected===d?null:d;panel.querySelectorAll('.chip').forEach(x=>x.classList.toggle('sel',selected&&x.dataset.id===selected.id))}
    };
    c.onpointercancel=()=>{sx=null;ghost.hidden=true;c.style.opacity='';setHot(null)};
    c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selected=d;panel.querySelectorAll('.chip').forEach(x=>x.classList.toggle('sel',x===c))}};
  }
  onMuscle=t=>{if(selected)tryPlace(selected,t,panel.querySelector(`.chip[data-id="${selected.id}"]`));else if(!placed.has(t.id))toast('Primer tria un nom de la llista')};
  render();
}

/* Motor comú de preguntes */
function quiz({title,intro,askFor,setup,replay}){
  let queue=shuffle(replay||pool()),i=0,ok=0,ko=0,missed=[],locked=false;
  const showScore=()=>scoreEl.innerHTML=`<span class="ok">✓ ${ok}</span><span class="bad">✗ ${ko}</span>`;
  const next=()=>{
    clearMarks();locked=false;
    if(i>=queue.length)return finish();
    const d=queue[i];showScore();
    panel.innerHTML=`<div class="ph"><h2>${title}</h2><p>${intro}</p>${replay?'':`<div class="row">${poolSelect()}</div>`}
      <div class="progress" aria-hidden="true"><span style="width:${i/queue.length*100}%"></span></div></div>
      <div class="pb"><div class="ask"><span class="k">Pregunta ${i+1} de ${queue.length}</span>${askFor(d)}</div>
      <div id="qbody"></div><div class="fb" id="fb" aria-live="polite"></div>
      <div class="row"><button class="btn" id="skip">No ho sé</button><button class="btn primary" id="nextb" hidden>Següent</button></div></div>`;
    bindPool();
    $('#skip').onclick=()=>resolve(d,false,'');
    $('#nextb').onclick=()=>{i++;next()};
    setup(d,(good,extra)=>resolve(d,good,extra||''));
  };
  const resolve=(d,good,extra)=>{
    if(locked)return;locked=true;
    record(d.id,good);good?ok++:ko++;if(!good)missed.push(d);showScore();
    cls(d,'target',false);cls(d,'reveal',true);cls(d,'found',true);
    const fb=$('#fb');fb.className='fb '+(good?'ok':'bad');
    fb.innerHTML=(good?`Molt bé! És el ${esc(d.n.toLowerCase())}.`:`Era el ${esc(d.n.toLowerCase())}. Mira’l al dibuix.`)
      +`<small>${esc(d.fn)}${extra?' '+esc(extra):''}</small>`;
    panel.querySelectorAll('#qbody input,#qbody button').forEach(x=>x.disabled=true);
    $('#skip').hidden=true;
    const nb=$('#nextb');
    if(good&&!extra)setTimeout(()=>{if(queue[i]===d&&locked){i++;next()}},reduce?900:1700);
    else{nb.hidden=false;nb.focus({preventScroll:true})}
  };
  const finish=()=>{
    const pct=Math.round(ok/queue.length*100);
    panel.innerHTML=`<div class="ph"><h2>${title}</h2><div class="row">${poolSelect()}</div></div>
      <div class="pb"><div class="summary"><span class="eyebrow">Resultat</span><div class="big">${ok}/${queue.length}</div>
      <p>${pct===100?'Tots bé. Ja te’ls saps!':pct>=70?'Molt bé, ja quasi ho tens.':'Repassa els que has fallat i torna-hi.'}</p>
      ${missed.length?`<div><p class="muted">Has fallat:</p><div class="missed">${missed.map(d=>`<span>${esc(d.n)}</span>`).join('')}</div></div>`:''}
      <div class="row">${missed.length?'<button class="btn primary" id="retry">Repeteix els fallats</button>':''}<button class="btn" id="again">Torna a començar</button></div></div></div>`;
    bindPool();
    $('#again').onclick=()=>start(mode);
    const r=$('#retry');if(r)r.onclick=()=>{const m=missed.slice();clearMarks();quiz({title,intro,askFor,setup,replay:m})};
  };
  next();
  return {get locked(){return locked}};
}
// toca el múscul correcte (Troba-ho i Per a què serveix?)
function tapSetup(qref){
  return (d,done)=>{onMuscle=t=>{if(qref.q.locked)return;if(t.id===d.id){flash(t,'ok');done(true)}
    else{flash(t,'bad');cls(t,'reveal',true);setTimeout(()=>cls(t,'reveal',false),1500);done(false,`Has tocat el ${t.n.toLowerCase()}.`)}}};
}

/* Troba-ho: et dic el nom, tu toques el múscul */
function findGame(){
  const r={};
  r.q=quiz({title:'Troba-ho al dibuix',intro:'Toca el múscul que té aquest nom.',
    askFor:d=>`<div class="q">${esc(d.n)}</div>`,setup:tapSetup(r)});
}

/* Per a què serveix?: llegeixes la funció i toques el múscul */
function fnGame(){
  const r={};
  r.q=quiz({title:'Per a què serveix?',intro:'Llegeix què fa el múscul i toca’l al dibuix.',
    askFor:d=>`<div class="q fn">${esc(d.fn)}</div>`,setup:tapSetup(r)});
}

/* Escriu el nom: el dibuix marca un múscul i l'has d'escriure sense opcions */
function typeGame(){
  quiz({title:'Escriu el nom',intro:'Mira el múscul que s’encén al dibuix i escriu com es diu. Compte amb l’ortografia i els accents.',
    askFor:()=>`<div class="q">Com es diu aquest múscul?</div>`,
    setup:(d,done)=>{
      cls(d,'target',true);
      let tries=0,hint=0;
      $('#qbody').innerHTML=`<form class="tform" id="tf" autocomplete="off">
        <input type="text" id="ans" aria-label="Nom del múscul" placeholder="Nom del múscul" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button class="btn primary">Comprova</button></form>
        <div class="row" style="margin-top:10px"><button class="btn" type="button" id="hintb">Pista</button><span class="hint" id="hintv"></span></div>`;
      const inp=$('#ans'),fb=$('#fb');
      if(matchMedia('(pointer:fine)').matches)inp.focus({preventScroll:true});
      $('#hintb').onclick=()=>{
        const letters=[...d.n].filter(c=>c!==' ').length;
        hint=Math.min(hint+1,letters-1);let k=0;
        $('#hintv').textContent=[...d.n].map(c=>c===' '?'  ':(k++<hint?c:'_')).join(' ');
      };
      $('#tf').onsubmit=e=>{
        e.preventDefault();
        const r=check(d,inp.value);
        if(r.empty){fb.className='fb near';fb.textContent='Escriu el nom abans de comprovar.';return}
        if(r.ok)return done(true,r.note);
        if(r.near&&tries===0){tries++;fb.className='fb near';fb.textContent='Quasi! Revisa com s’escriu i torna-ho a provar.';inp.select();return}
        done(false,r.other?`Has escrit «${r.other.n}», que és un altre múscul.`:`Has escrit «${inp.value.trim()}».`);
      };
    }});
}

/* De memòria: escriu tots els músculs de cada vista */
function recallGame(){
  panel.innerHTML=`<div class="ph"><h2>De memòria</h2>
    <p>Escriu els músculs que es veuen de davant i els que es veuen de darrere. L’ordre no importa.</p></div>
    <div class="pb"><form id="rf" autocomplete="off" class="recall">
    ${VIEWS.map(v=>{const n=MUSCLES.filter(d=>d.v===v.k).length;return `<section class="sec">
      <h3><span>${v.name}</span><span class="n">${n} músculs</span></h3>
      ${Array.from({length:n},(_,i)=>`<div class="slot"><span class="mk" id="m-${v.k}-${i}"></span><input type="text" id="r-${v.k}-${i}" aria-label="${esc(v.name)}, múscul ${i+1}" autocapitalize="off" autocorrect="off" spellcheck="false"></div><div class="why" id="w-${v.k}-${i}"></div>`).join('')}
      <div class="sol" id="s-${v.k}" hidden></div></section>`}).join('')}
    <div class="fb" id="rfb" aria-live="polite"></div>
    <div class="row"><button class="btn primary">Comprova</button><button class="btn" type="button" id="showsol">Mostra les solucions</button><button class="btn" type="button" id="clear">Esborra-ho tot</button></div>
    </form></div>`;
  const run=()=>{
    clearMarks();let good=0;
    VIEWS.forEach(v=>{
      const ms=MUSCLES.filter(d=>d.v===v.k),used=new Set();
      ms.forEach((_,i)=>{
        const inp=$(`#r-${v.k}-${i}`),m=$(`#m-${v.k}-${i}`),w=$(`#w-${v.k}-${i}`);
        inp.classList.remove('ok','bad');m.textContent='';w.textContent='';
        const val=inp.value;if(!norm(val))return;
        const hit=ms.find(d=>!used.has(d.id)&&check(d,val).ok);
        if(hit){used.add(hit.id);good++;inp.classList.add('ok');m.textContent='✓';m.style.color='var(--ok)';cls(hit,'done',true);
          const note=check(hit,val).note;if(note)w.textContent=note}
        else{inp.classList.add('bad');m.textContent='✗';m.style.color='var(--bad)';
          const other=MUSCLES.find(d=>check(d,val).ok);
          w.textContent=other?(other.v===v.k?`El ${other.n.toLowerCase()} ja l’has escrit.`:`El ${other.n.toLowerCase()} es veu a la ${vName(other.v).toLowerCase()}.`)
            :(ms.some(d=>check(d,val).near)?'Quasi! Revisa l’ortografia.':'')}
      });
      ms.forEach(d=>record(d.id,used.has(d.id)));
    });
    scoreEl.innerHTML=`<span class="ok">✓ ${good}/14</span>`;
    const fb=$('#rfb');fb.className='fb '+(good===14?'ok':'bad');
    fb.textContent=good===14?'Tots 14 correctes. Perfecte!':`Tens ${good} de 14. Corregeix els que estan en vermell.`;
  };
  $('#rf').onsubmit=e=>{e.preventDefault();run()};
  $('#showsol').onclick=e=>{
    const show=e.target.dataset.on!=='1';e.target.dataset.on=show?'1':'';e.target.textContent=show?'Amaga les solucions':'Mostra les solucions';
    VIEWS.forEach(v=>{const s=$(`#s-${v.k}`);s.hidden=!show;s.textContent='Solució: '+MUSCLES.filter(d=>d.v===v.k).map(d=>d.n).join(', ')});
  };
  $('#clear').onclick=()=>recallGame();
}

start('estudia');
</script>
