<title>Rius d'Europa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Spectral:ital,wght@1,500&display=swap">
<style>
/* Layout: one-screen app — atlas map fills the stage, a study panel docks right (stacks below on phones). Colors of each sea match the highlighters of the study sheet. */
:root{
  --bg:#e8eeed; --panel:#fbfcfa; --ink:#1b2a2e; --muted:#5a6a6e; --line:#d0dad9;
  --sea:#bcd8e2; --grat:#a7c9d6; --land:#e4e2c6; --coast:#8f9c79; --border:#cfc8a8; --halo:#f8f9f3;
  --river:#2f6fb4; --river-case:#f8f9f3;
  --accent:#0c6a88; --accent-ink:#ffffff; --ok:#2c8a4b; --bad:#c23e2b;
  --c-med:#d02f6a; --c-caspi:#2f8a3e; --c-negre:#0f86a8; --c-atl:#d9620c; --c-artic:#a78300;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-sea:"Spectral",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171a; --panel:#152024; --ink:#e4eded; --muted:#9bb0b3; --line:#29393e;
  --sea:#14313d; --grat:#1c4150; --land:#2b3326; --coast:#5f6f52; --border:#454a39; --halo:#0e1619;
  --river:#6fb7f2; --river-case:#0e1619;
  --accent:#5fc3e3; --accent-ink:#06222c; --ok:#5ccf85; --bad:#ff7d68;
  --c-med:#f472a4; --c-caspi:#6fd17e; --c-negre:#4fd0f0; --c-atl:#ffa057; --c-artic:#f0d04a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171a; --panel:#152024; --ink:#e4eded; --muted:#9bb0b3; --line:#29393e;
  --sea:#14313d; --grat:#1c4150; --land:#2b3326; --coast:#5f6f52; --border:#454a39; --halo:#0e1619;
  --river:#6fb7f2; --river-case:#0e1619;
  --accent:#5fc3e3; --accent-ink:#06222c; --ok:#5ccf85; --bad:#ff7d68;
  --c-med:#f472a4; --c-caspi:#6fd17e; --c-negre:#4fd0f0; --c-atl:#ffa057; --c-artic:#f0d04a; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:12px;padding-block:12px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(22px,3vw,30px);line-height:1;letter-spacing:-.01em}
h1 small{font-weight:600;font-size:.5em;color:var(--muted);letter-spacing:0;margin-left:6px}
.modes{display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.modes button{border:0;background:none;padding:8px 12px;border-radius:9px;font-weight:700;color:var(--muted)}
.modes button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.modes button:hover:not([aria-selected="true"]){color:var(--ink);background:var(--bg)}
.score{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;display:flex;gap:14px}
.score .ok{color:var(--ok)} .score .bad{color:var(--bad)}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:12px;min-height:0}
.mapwrap{position:relative;min-height:0;border-radius:14px;overflow:hidden;background:var(--sea);border:1px solid var(--line)}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map:active{cursor:grabbing}
.zoomctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.zoomctl button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:18px;font-weight:700;line-height:1}
.maphint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:3px 8px;border-radius:6px}
.toast{position:absolute;left:50%;top:12px;transform:translate(-50%,-6px);opacity:0;transition:opacity .2s,transform .2s;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:700;pointer-events:none;white-space:nowrap;max-width:80%;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{color:var(--ok);border-color:var(--ok)} .toast.bad{color:var(--bad);border-color:var(--bad)}

/* map layers */
.land{fill:var(--land);stroke:var(--coast);stroke-width:.7}
.borders{fill:none;stroke:var(--border);stroke-width:.6}
.grat{fill:none;stroke:var(--grat);stroke-width:.5}
.land,.borders,.grat,.rv path{vector-effect:non-scaling-stroke}
.sea text{font-family:var(--f-sea);font-style:italic;font-size:13px;fill:var(--muted);text-anchor:middle;paint-order:stroke;stroke:var(--sea);stroke-width:3px;opacity:.9}
.sea .big{font-size:16px;letter-spacing:.06em}
.study .sea .main-sea{fill:var(--c)}

.rv{cursor:pointer}
.rv.off,.rl.off{display:none}
.rv path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.rv .hit{stroke:transparent;stroke-width:22;pointer-events:stroke}
.rv .case{stroke:var(--river-case);stroke-width:5.5;opacity:.8}
.rv .main{stroke:var(--river);stroke-width:2.6;transition:stroke .2s}
.rv .glow{stroke:var(--accent);stroke-width:13;opacity:0}
.study .rv .main,.rv.found .main{stroke:var(--c)}
.rv:hover .main,.rv.hot .main{stroke-width:4.2}
.rv.hot .glow{opacity:.35;stroke:var(--ink)}
.rv.target .main{stroke-width:4.2}
.rv.target .glow{animation:glow 1s ease-in-out infinite alternate}
.rv.done .main{stroke:var(--ok)}
.rv.flash-ok .glow{opacity:.55;stroke:var(--ok)}
.rv.flash-bad .glow{opacity:.55;stroke:var(--bad)}
.rv.flash-bad .main{stroke:var(--bad)}
@keyframes glow{from{opacity:.15}to{opacity:.65}}

.rl{pointer-events:none}
.rl .mouth{stroke:var(--halo);stroke-width:1.6;fill:var(--river)}
.study .rl .mouth,.rl.found .mouth{fill:var(--c)}
.rl .lab{font-size:13px;font-weight:700;paint-order:stroke;stroke:var(--halo);stroke-width:3.5px;stroke-linejoin:round;opacity:0;fill:var(--ink)}
.study .rl .lab,.rl.found .lab{fill:var(--c)}
.study.labels .rl .lab,.rl.reveal .lab,.rl.done .lab,.rl.found .lab{opacity:1}

/* panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.ph{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.ph h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.15;text-wrap:balance}
.ph p{margin:0;color:var(--muted);font-size:13.5px}
.pb{padding:12px 16px 16px;overflow:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:150px}
.field label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
select,input[type=text]{font:inherit;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.btn{border:1px solid var(--line);background:var(--bg);padding:8px 14px;border-radius:9px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:hover{border-color:var(--accent)}
.toggle{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}

.sec h3{margin:0 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.sec h3 .n{color:var(--muted);font-weight:400;letter-spacing:0;text-transform:none}
.sw{width:12px;height:4px;border-radius:2px;flex:none;background:currentColor}
.items{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:8px}
.item:hover,.item.active{background:var(--bg)}
.item .nm{flex:1;min-width:0;font-weight:700}
.item .note{display:block;font-size:12px;color:var(--muted);font-weight:400}
.pips{display:flex;gap:3px}
.pips i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--ok)}

.progress{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.progress span{display:block;height:100%;background:var(--ok);transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--panel);font-weight:700;font-size:14px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.chip.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.chip.shake{animation:shake .35s}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;box-shadow:0 8px 20px rgb(0 0 0 / .25);cursor:grabbing}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

.ask{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.ask .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ask .q{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1;text-wrap:balance}
.fb{font-weight:700;min-height:1.4em}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)} .fb.near{color:var(--c-atl)}
.fb small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.opts{display:grid;grid-template-columns:1fr;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 10px;font-weight:700;text-align:left;display:flex;gap:10px;align-items:center}
.opt kbd{font-family:var(--f-body);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.opt .sw{width:16px;height:5px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--panel))}
.opt:disabled{cursor:default}
.tform{display:flex;gap:8px}
.tform input{font-size:18px;font-weight:700;padding:10px 12px}
.hint{font-family:ui-monospace,Consolas,monospace;font-size:17px;letter-spacing:.25em;font-weight:700}
.summary{display:flex;flex-direction:column;gap:10px}
.big{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.missed{display:flex;flex-wrap:wrap;gap:6px}
.missed span{font-size:13px;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--bad) 12%,var(--bg));color:var(--bad);font-weight:700}
.muted{color:var(--muted);font-size:13px}

.recall{display:flex;flex-direction:column;gap:6px}
.recall .slot{display:flex;align-items:center;gap:8px}
.recall .slot input{flex:1}
.recall .slot .mk{width:20px;text-align:center;font-weight:700}
.recall input.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--bg))}
.recall input.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--bg))}
.recall .why{font-size:12.5px;color:var(--muted);margin-left:28px}
.sol{font-size:13px;color:var(--muted)}

@media (max-width:820px){
  html,body{height:auto}
  .app{height:auto}
  .stage{grid-template-columns:1fr}
  .mapwrap{height:62svh;min-height:340px}
  .pb{overflow:visible}
  .score{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</div>

/* ---------- comparació de respostes escrites ---------- */
const deacc=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
const norm=s=>deacc(String(s).toLowerCase().trim()).replace(/^(el\s+)?(riu\s+)/,'').replace(/^(el|la|l')\s*/,'').replace(/[^a-z]/g,'');
const names=d=>[d.n,...(d.alias||[])].map(norm);
function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function check(d,v){
  const nv=norm(v);
  if(!nv)return {empty:true};
  if(names(d).includes(nv)){
    let note='';
    if(nv!==norm(d.n))note=`Al guió s’escriu «${d.n}».`;
    else if(v.trim().toLowerCase().replace(/^(el\s+)?riu\s+/,'')!==d.n.toLowerCase())note=`Fixa’t en com s’escriu: «${d.n}».`;
    return {ok:true,note};
  }
  const other=RIVERS.find(r=>r!==d&&names(r).includes(nv));
  if(other)return {other};
  const lim=nv.length<=3?1:2;
  if(names(d).some(x=>lev(nv,x)<=lim))return {near:true};
  return {};
}

function flyTo(d){

/* Col·loca (arrossega noms sobre els rius) */
function placeGame(){
  const items=pool();let placed=new Set(),errors=0,selected=null;
  const sc=()=>scoreEl.innerHTML=`<span class="ok">✓ ${placed.size}/${items.length}</span><span class="bad">✗ ${errors}</span>`;
  const render=()=>{
    const left=shuffle(items.filter(d=>!placed.has(d.id)));sc();
    panel.innerHTML=`<div class="ph"><h2>Col·loca els noms</h2>
      <p>Arrossega cada nom fins al seu riu. També pots tocar un nom i després tocar el riu.</p>
      <div class="row">${poolSelect()}</div>
      <div class="progress" aria-hidden="true"><span style="width:${placed.size/items.length*100}%"></span></div></div>
      <div class="pb">${left.length?`<div class="chips">${left.map(d=>`<span class="chip" data-id="${d.id}" role="button" tabindex="0">${esc(d.n)}</span>`).join('')}</div>`
        :`<div class="summary"><span class="eyebrow">Mapa complet</span><div class="big">${items.length}/${items.length}</div>
          <p>${errors===0?'Cap error. Perfecte!':`Ho has aconseguit amb ${errors} ${errors===1?'error':'errors'}.`}</p>
          <div class="row"><button class="btn primary" id="again">Torna-hi</button></div></div>`}
        <p class="muted">Consell: fes zoom per separar el Vístula i l’Oder, que estan molt a prop.</p></div>`;
    bindPool();
    const again=$('#again');if(again)again.onclick=()=>start('colloca');
    panel.querySelectorAll('.chip').forEach(bindChip);
  };
  const tryPlace=(d,target,chipEl)=>{
    if(!target)return;
    if(target.id===d.id){
      placed.add(d.id);record(d.id,true);cls(d,'done',true);flash(d,'ok');
      toast(`Correcte: ${d.n}`,'ok');selected=null;render();
    }else if(placed.has(target.id)){toast('Aquest riu ja té el seu nom');}
    else{errors++;record(d.id,false);flash(target,'bad');toast(`Aquest no és el ${d.n}`,'bad');
      if(chipEl){chipEl.classList.remove('shake');void chipEl.offsetWidth;chipEl.classList.add('shake')}
      sc();}
  };
  const riverAt=(x,y)=>{const el=document.elementFromPoint(x,y);const g=el&&el.closest&&el.closest('.rv');return g&&!g.classList.contains('off')?BY[g.dataset.id]:null};
  const ghost=$('#ghost');
  function bindChip(el){
    const d=BY[el.dataset.id];let sx,sy,drag=false,hot=null;
    const setHot=n=>{if(n!==hot){hot&&cls(hot,'hot',false);hot=n;hot&&cls(hot,'hot',true)}};
    el.onpointerdown=e=>{e.preventDefault();sx=e.clientX;sy=e.clientY;drag=false;el.setPointerCapture(e.pointerId)};
    el.onpointermove=e=>{
      if(sx==null)return;
      if(!drag&&Math.hypot(e.clientX-sx,e.clientY-sy)>6){drag=true;ghost.innerHTML=el.innerHTML;ghost.hidden=false;el.style.opacity=.35}
      if(drag){
        ghost.style.transform=`translate(${e.clientX-ghost.offsetWidth/2}px,${e.clientY-ghost.offsetHeight-14}px)`;
        setHot(riverAt(e.clientX,e.clientY));
      }
    };
    el.onpointerup=e=>{
      if(sx==null)return;sx=null;
      if(drag){ghost.hidden=true;el.style.opacity='';setHot(null);tryPlace(d,riverAt(e.clientX,e.clientY),el)}
      else{selected=selected===d?null:d;panel.querySelectorAll('.chip').forEach(c=>c.classList.toggle('sel',selected&&c.dataset.id===selected.id))}
    };
    el.onpointercancel=()=>{sx=null;ghost.hidden=true;el.style.opacity='';setHot(null)};
    el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selected=d;panel.querySelectorAll('.chip').forEach(c=>c.classList.toggle('sel',c===el))}};
  }
  onRiver=t=>{if(selected)tryPlace(selected,t,panel.querySelector(`.chip[data-id="${selected.id}"]`));else if(!placed.has(t.id))toast('Primer tria un nom de la llista')};
  render();
}

/* Motor comú de preguntes */
function quiz({title,intro,askFor,setup,replay}){
  let queue=shuffle(replay||pool()),i=0,ok=0,ko=0,missed=[],locked=false;
  const showScore=()=>scoreEl.innerHTML=`<span class="ok">✓ ${ok}</span><span class="bad">✗ ${ko}</span>`;
  const next=()=>{
    clearMarks();locked=false;
    if(i>=queue.length)return finish();
    const d=queue[i];showScore();
    panel.innerHTML=`<div class="ph"><h2>${title}</h2><p>${intro}</p>${replay?'':`<div class="row">${poolSelect()}</div>`}
      <div class="progress" aria-hidden="true"><span style="width:${i/queue.length*100}%"></span></div></div>
      <div class="pb"><div class="ask"><span class="k">Pregunta ${i+1} de ${queue.length}</span>${askFor(d)}</div>
      <div id="qbody"></div><div class="fb" id="fb" aria-live="polite"></div>
      <div class="row"><button class="btn" id="skip">No ho sé</button><button class="btn primary" id="nextb" hidden>Següent</button></div></div>`;
    bindPool();
    $('#skip').onclick=()=>resolve(d,false,'');
    $('#nextb').onclick=()=>{i++;next()};
    setup(d,(good,extra)=>resolve(d,good,extra||''));
  };
  const resolve=(d,good,extra)=>{
    if(locked)return;locked=true;
    record(d.id,good);good?ok++:ko++;if(!good)missed.push(d);showScore();
    cls(d,'target',false);cls(d,'reveal',true);cls(d,'found',true);d.rv.raise();
    const fb=$('#fb');fb.className='fb '+(good?'ok':'bad');
    fb.innerHTML=(good?`Molt bé! És el ${esc(d.n)}.`:`Era el ${esc(d.n)}. Mira’l al mapa.`)
      +`<small>Vessant ${esc(vName(d.v))} · desemboca ${esc(VESS.find(s=>s.k===d.v).sea)}${extra?'. '+esc(extra):''}</small>`;
    panel.querySelectorAll('#qbody input,#qbody button').forEach(x=>x.disabled=true);
    $('#skip').hidden=true;
    const nb=$('#nextb');
    if(good&&!extra)setTimeout(()=>{if(queue[i]===d&&locked){i++;next()}},reduce?700:1300);
    else{nb.hidden=false;nb.focus({preventScroll:true})}
  };
  const finish=()=>{
    const pct=Math.round(ok/queue.length*100);
    panel.innerHTML=`<div class="ph"><h2>${title}</h2><div class="row">${poolSelect()}</div></div>
      <div class="pb"><div class="summary"><span class="eyebrow">Resultat</span><div class="big">${ok}/${queue.length}</div>
      <p>${pct===100?'Tots bé. Ja te’ls saps!':pct>=70?'Molt bé, ja quasi ho tens.':'Repassa els que has fallat i torna-hi.'}</p>
      ${missed.length?`<div><p class="muted">Has fallat:</p><div class="missed">${missed.map(d=>`<span>${esc(d.n)}</span>`).join('')}</div></div>`:''}
      <div class="row">${missed.length?'<button class="btn primary" id="retry">Repeteix els fallats</button>':''}<button class="btn" id="again">Torna a començar</button></div></div></div>`;
    bindPool();
    $('#again').onclick=()=>start(mode);
    const r=$('#retry');if(r)r.onclick=()=>{const m=missed.slice();clearMarks();quiz({title,intro,askFor,setup,replay:m})};
  };
  next();
  return {get locked(){return locked}};
}

function typeGame(){
  quiz({title:'Escriu el nom',intro:'Mira el riu que brilla al mapa i escriu com es diu. Compte amb l’ortografia i els accents.',
    askFor:()=>`<div class="q">Com es diu aquest riu?</div>`,
    setup:(d,done)=>{
      cls(d,'target',true);d.rv.raise();
      let tries=0,hint=0;
      $('#qbody').innerHTML=`<form class="tform" id="tf" autocomplete="off">
        <input type="text" id="ans" aria-label="Nom del riu" placeholder="Nom del riu" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button class="btn primary">Comprova</button></form>
        <div class="row" style="margin-top:10px"><button class="btn" type="button" id="hintb">Pista</button><span class="hint" id="hintv"></span></div>`;
      const inp=$('#ans'),fb=$('#fb');
      if(matchMedia('(pointer:fine)').matches)inp.focus({preventScroll:true});
      $('#hintb').onclick=()=>{
        const letters=[...d.n].filter(c=>c!==' ').length;
        hint=Math.min(hint+1,letters-1);let k=0;
        $('#hintv').textContent=[...d.n].map(c=>c===' '?'  ':(k++<hint?c:'_')).join(' ');
      };
      $('#tf').onsubmit=e=>{
        e.preventDefault();
        const r=check(d,inp.value);
        if(r.empty){fb.className='fb near';fb.textContent='Escriu el nom abans de comprovar.';return}
        if(r.ok)return done(true,r.note);
        if(r.near&&tries===0){tries++;fb.className='fb near';fb.textContent='Quasi! Revisa com s’escriu i torna-ho a provar.';inp.select();return}
        done(false,r.other?`Has escrit ${r.other.n}, que és un altre riu`:`Has escrit «${inp.value.trim()}»`);
      };
    }});
}

/* On desemboca?: el mapa marca un riu i tries el mar */
function mouthGame(){
  quiz({title:'On desemboca?',intro:'Mira el riu marcat al mapa i tria a quin mar o oceà va a parar.',
    askFor:d=>`<div class="q">On desemboca el ${esc(d.n)}?</div>`,
    setup:(d,done)=>{
      cls(d,'target',true);cls(d,'reveal',true);d.rv.raise();
      $('#qbody').innerHTML=`<div class="opts">${VESS.map((s,j)=>`<button class="opt" data-k="${s.k}"><kbd>${j+1}</kbd>${swatch(s.k)}${esc(s.name)}</button>`).join('')}</div>`;
      const btns=[...panel.querySelectorAll('.opt')];
      const pick=b=>{if(b.disabled)return;btns.forEach(x=>{x.disabled=true;if(x.dataset.k===d.v)x.classList.add('right')});if(b.dataset.k!==d.v)b.classList.add('wrong');done(b.dataset.k===d.v)};
      btns.forEach(b=>b.onclick=()=>pick(b));
      document.onkeydown=e=>{const n=+e.key;if(n>=1&&n<=btns.length)pick(btns[n-1])};
    }});
}

/* Per mars: escriu de memòria els rius de cada vessant */
function recallGame(){
  panel.innerHTML=`<div class="ph"><h2>Per mars</h2>
    <p>Escriu de memòria els rius de cada vessant, com al guió. L’ordre no importa.</p></div>
    <div class="pb"><form id="rf" autocomplete="off" class="recall">
    ${VESS.map(s=>{const n=RIVERS.filter(d=>d.v===s.k).length;return `<section class="sec" data-k="${s.k}">
      <h3 style="color:${col(s.k)}">${swatch(s.k)}<span>${s.name}</span><span class="n">${n} rius</span></h3>
      ${Array.from({length:n},(_,i)=>`<div class="slot"><span class="mk" id="m-${s.k}-${i}"></span><input type="text" id="r-${s.k}-${i}" aria-label="${esc(s.name)}, riu ${i+1}" autocapitalize="off" autocorrect="off" spellcheck="false"></div><div class="why" id="w-${s.k}-${i}"></div>`).join('')}
      <div class="sol" id="s-${s.k}" hidden></div></section>`}).join('')}
    <div class="fb" id="rfb" aria-live="polite"></div>
    <div class="row"><button class="btn primary">Comprova</button><button class="btn" type="button" id="showsol">Mostra les solucions</button><button class="btn" type="button" id="clear">Esborra-ho tot</button></div>
    </form></div>`;
  const run=()=>{
    clearMarks();let good=0;
    VESS.forEach(s=>{
      const rs=RIVERS.filter(d=>d.v===s.k),used=new Set();
      rs.forEach((_,i)=>{
        const inp=$(`#r-${s.k}-${i}`),m=$(`#m-${s.k}-${i}`),w=$(`#w-${s.k}-${i}`);
        inp.classList.remove('ok','bad');m.textContent='';w.textContent='';
        const v=inp.value;if(!norm(v))return;
        const hit=rs.find(d=>!used.has(d.id)&&check(d,v).ok);
        if(hit){used.add(hit.id);good++;inp.classList.add('ok');m.textContent='✓';m.style.color='var(--ok)';cls(hit,'found',true);
          const note=check(hit,v).note;if(note)w.textContent=note}
        else{inp.classList.add('bad');m.textContent='✗';m.style.color='var(--bad)';
          const other=RIVERS.find(d=>check(d,v).ok);
          w.textContent=other?(other.v===s.k?`El ${other.n} ja l’has escrit.`:`El ${other.n} va ${VESS.find(x=>x.k===other.v).sea}.`)
            :(rs.some(d=>check(d,v).near)?'Quasi! Revisa l’ortografia.':'')}
      });
      rs.forEach(d=>record(d.id,used.has(d.id)));
    });
    scoreEl.innerHTML=`<span class="ok">✓ ${good}/13</span>`;
    const fb=$('#rfb');fb.className='fb '+(good===13?'ok':'bad');
    fb.textContent=good===13?'Tots 13 correctes. Perfecte!':`Tens ${good} de 13. Corregeix els que estan en vermell.`;
  };
  $('#rf').onsubmit=e=>{e.preventDefault();run()};
  $('#showsol').onclick=e=>{
    const show=e.target.dataset.on!=='1';e.target.dataset.on=show?'1':'';e.target.textContent=show?'Amaga les solucions':'Mostra les solucions';
    VESS.forEach(s=>{const el=$(`#s-${s.k}`);el.hidden=!show;el.textContent='Solució: '+RIVERS.filter(d=>d.v===s.k).map(d=>d.n).join(', ')});
  };
  $('#clear').onclick=()=>recallGame();
  clearMarks();scoreEl.innerHTML='';
}

start('estudia');
</script>
