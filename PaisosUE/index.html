<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Països de la Unió Europea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Spectral:ital,wght@1,500&display=swap">
<style>
/* Layout: one-screen app — political map fills the stage, a study panel docks right (stacks below on phones). Pastel country fills echo the school's political map. */
:root{
  --bg:#e8ecef; --panel:#fbfcfd; --ink:#1d2731; --muted:#5b6874; --line:#d1d9e0;
  --sea:#c3dcea; --grat:#aecbdc; --off:#e6e3dc; --coast:#97a2a8; --border:#ffffff; --halo:#f8fafb;
  --p1:#f3dc7a; --p2:#c6dd8c; --p3:#f2b98a; --p4:#d3b1e0; --p5:#f1a7b6;
  --cap:#c0261b; --eu:#1f4fa0;
  --accent:#0c6a88; --accent-ink:#ffffff; --ok:#2c8a4b; --bad:#c23e2b; --near:#b86a00;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-sea:"Spectral",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1519; --panel:#162027; --ink:#e5ecf0; --muted:#9db0bb; --line:#293a45;
  --sea:#13303f; --grat:#1b4052; --off:#2a2f30; --coast:#53636b; --border:#0f1519; --halo:#0e161b;
  --p1:#6f6430; --p2:#4f6435; --p3:#734d33; --p4:#5b4569; --p5:#6d3f4b;
  --cap:#ff8a7a; --eu:#8fb4f5;
  --accent:#5fc3e3; --accent-ink:#06222c; --ok:#5ccf85; --bad:#ff7d68; --near:#f2b257; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1519; --panel:#162027; --ink:#e5ecf0; --muted:#9db0bb; --line:#293a45;
  --sea:#13303f; --grat:#1b4052; --off:#2a2f30; --coast:#53636b; --border:#0f1519; --halo:#0e161b;
  --p1:#6f6430; --p2:#4f6435; --p3:#734d33; --p4:#5b4569; --p5:#6d3f4b;
  --cap:#ff8a7a; --eu:#8fb4f5;
  --accent:#5fc3e3; --accent-ink:#06222c; --ok:#5ccf85; --bad:#ff7d68; --near:#f2b257; color-scheme:dark}

html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:12px;padding-block:12px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.eyebrow a{color:inherit}
h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(22px,3vw,30px);line-height:1;letter-spacing:-.01em}
h1 small{font-weight:600;font-size:.5em;color:var(--muted);letter-spacing:0;margin-left:6px}
.modes{display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.modes button{border:0;background:none;padding:8px 11px;border-radius:9px;font-weight:700;color:var(--muted)}
.modes button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.modes button:hover:not([aria-selected="true"]){color:var(--ink);background:var(--bg)}
.score{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;display:flex;gap:14px}
.score .ok{color:var(--ok)} .score .bad{color:var(--bad)}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:12px;min-height:0}
.mapwrap{position:relative;min-height:0;border-radius:14px;overflow:hidden;background:var(--sea);border:1px solid var(--line)}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map:active{cursor:grabbing}
.zoomctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.zoomctl button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:18px;font-weight:700;line-height:1}
.maphint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:3px 8px;border-radius:6px}
.legend{position:absolute;left:12px;top:10px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:4px 9px;border-radius:6px;display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--cap);border:1.5px solid var(--halo);display:inline-block}
.toast{position:absolute;left:50%;top:12px;transform:translate(-50%,-6px);opacity:0;transition:opacity .2s,transform .2s;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:700;pointer-events:none;white-space:nowrap;max-width:80%;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{color:var(--ok);border-color:var(--ok)} .toast.bad{color:var(--bad);border-color:var(--bad)}

/* mapa */
.grat{fill:none;stroke:var(--grat);stroke-width:.5}
.world{fill:var(--off);stroke:var(--coast);stroke-width:.5}
.grat,.world,.ct path{vector-effect:non-scaling-stroke}
.ct{cursor:pointer}
.ct path{stroke:var(--border);stroke-width:1.1;transition:fill .15s}
.ct.c1 path{fill:var(--p1)} .ct.c2 path{fill:var(--p2)} .ct.c3 path{fill:var(--p3)} .ct.c4 path{fill:var(--p4)} .ct.c5 path{fill:var(--p5)}
.ct:hover path,.ct.hot path{fill:color-mix(in srgb,var(--accent) 45%,var(--p1))}
.ct.off{pointer-events:none}
.ct.off path{fill:var(--off)}
.ct.target path{animation:pulse .9s ease-in-out infinite alternate}
.ct.done path{fill:color-mix(in srgb,var(--ok) 55%,var(--panel))}
.ct.flash-ok path{fill:var(--ok)}
.ct.flash-bad path{fill:var(--bad)}
@keyframes pulse{from{fill:var(--p1)}to{fill:var(--accent)}}
.mini{cursor:pointer}
.mini circle{fill:transparent;stroke:var(--eu);stroke-width:2;stroke-dasharray:3 2}
.mini.off{display:none}
.mini.target circle,.mini.hot circle{stroke:var(--accent);stroke-width:3;stroke-dasharray:none}
.mini.done circle{stroke:var(--ok);stroke-dasharray:none}
.cl text,.cap text{paint-order:stroke;stroke:var(--halo);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none;opacity:0}
.cl text{font-size:12.5px;font-weight:700;fill:var(--eu);text-anchor:middle;text-transform:uppercase;letter-spacing:.05em}
.cl.small text{font-size:11px}
.cap{pointer-events:none}
.cap .dot{fill:var(--cap);stroke:var(--halo);stroke-width:1.5}
.cap text{font-size:12px;font-weight:700;fill:var(--cap)}
.cap.off,.cl.off{display:none}
.cap.hot .dot,.cap.target .dot{stroke:var(--accent);stroke-width:3}
.study.show-p .cl text,.study.show-c .cap text,.cl.reveal text,.cl.done text,.cap.reveal text,.cap.done text{opacity:1}
.cl.done text{fill:var(--ok)} .cap.done text{fill:var(--ok)}
.sea-l{font-family:var(--f-sea);font-style:italic;font-size:14px;fill:var(--muted);text-anchor:middle;pointer-events:none;opacity:.85}

/* panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.ph{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.ph h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.15;text-wrap:balance}
.ph p{margin:0;color:var(--muted);font-size:13.5px}
.pb{padding:12px 16px 16px;overflow:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:130px}
.field label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
select,input[type=text]{font:inherit;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.btn{border:1px solid var(--line);background:var(--bg);padding:8px 14px;border-radius:9px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:hover{border-color:var(--accent)}
.toggles{display:flex;gap:16px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}

.sec h3{margin:0 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:8px;color:var(--eu)}
.sec h3 .n{color:var(--muted);font-weight:400;letter-spacing:0;text-transform:none}
.items{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.item{display:grid;grid-template-columns:14px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:8px}
.item:hover,.item.active{background:var(--bg)}
.item .sw{width:14px;height:14px;border-radius:4px;border:1px solid var(--line)}
.item .nm{font-weight:700;min-width:0}
.item .cp{display:block;font-size:13px;color:var(--cap);font-weight:700}
.pips{display:flex;gap:3px}
.pips i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--ok)}

.progress{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.progress span{display:block;height:100%;background:var(--ok);transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--panel);font-weight:700;font-size:14px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.chip.capc{color:var(--cap)}
.chip.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.chip.shake{animation:shake .35s}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;box-shadow:0 8px 20px rgb(0 0 0 / .25);cursor:grabbing}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

.ask{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.ask .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ask .q{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.15;text-wrap:balance}
.ask .q .c{color:var(--cap)}
.fb{font-weight:700;min-height:1.4em}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)} .fb.near{color:var(--near)}
.fb small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.tform{display:flex;gap:8px}
.tform input{font-size:18px;font-weight:700;padding:10px 12px}
.hint{font-family:ui-monospace,Consolas,monospace;font-size:17px;letter-spacing:.25em;font-weight:700}
.summary{display:flex;flex-direction:column;gap:10px}
.big{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.missed{display:flex;flex-wrap:wrap;gap:6px}
.missed span{font-size:13px;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--bad) 12%,var(--bg));color:var(--bad);font-weight:700}
.muted{color:var(--muted);font-size:13px}

.recall{display:flex;flex-direction:column;gap:6px}
.recall .head,.recall .slot{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center}
.recall .head span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.recall .n{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.recall input{padding:6px 8px}
.recall input.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--bg))}
.recall input.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--bg))}
.recall .why{font-size:12.5px;color:var(--muted);margin-left:28px}
.recall .why:empty{display:none}
.sol{font-size:13px;color:var(--muted)}

@media (max-width:820px){
  html,body{height:auto}
  .app{height:auto}
  .stage{grid-template-columns:1fr}
  .mapwrap{height:62svh;min-height:340px}
  .pb{overflow:visible}
  .score{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="eyebrow"><a href="../">Repàs de 6è</a> · Medi social</span>
      <h1>Unió Europea<small>27 països i capitals</small></h1>
    </div>
    <nav class="modes" role="tablist" aria-label="Mode">
      <button role="tab" data-mode="estudia" aria-selected="true">Estudia</button>
      <button role="tab" data-mode="collp" aria-selected="false">Col·loca països</button>
      <button role="tab" data-mode="collc" aria-selected="false">Col·loca capitals</button>
      <button role="tab" data-mode="troba" aria-selected="false">Troba-ho</button>
      <button role="tab" data-mode="escp" aria-selected="false">Escriu el país</button>
      <button role="tab" data-mode="escc" aria-selected="false">Escriu la capital</button>
      <button role="tab" data-mode="memoria" aria-selected="false">De memòria</button>
    </nav>
    <div class="score" id="score" aria-live="polite"></div>
  </header>
  <main class="stage">
    <section class="mapwrap" aria-label="Mapa polític d'Europa">
      <svg id="map" role="img" aria-label="Mapa dels països de la Unió Europea"></svg>
      <div class="legend"><i></i> capital</div>
      <div class="zoomctl">
        <button id="zin" aria-label="Apropa">+</button>
        <button id="zout" aria-label="Allunya">−</button>
        <button id="zreset" aria-label="Mapa sencer">⤢</button>
      </div>
      <div class="maphint">Roda o pinça per fer zoom · arrossega per moure't</div>
      <div class="toast" id="toast"></div>
    </section>
    <aside class="panel" id="panel"></aside>
  </main>
</div>
<div id="ghost" class="chip ghost" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>

/* ---------- comparació de respostes escrites ---------- */
const deacc=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
const norm=s=>deacc(String(s).toLowerCase().trim()).replace(/^(el|la|els|les|l')\s+/,'').replace(/^l'/,'').replace(/[^a-z]/g,'');
const pNames=d=>[d.n,...d.pa].map(norm);
const cNames=d=>[d.cap,...d.ca].map(norm);
function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
// kind: 'p' país o 'c' capital
function check(d,kind,v){
  const nv=norm(v);
  if(!nv)return {empty:true};
  const official=kind==='p'?d.n:d.cap,list=kind==='p'?pNames(d):cNames(d);
  if(list.includes(nv)){
    let note='';
    if(nv!==norm(official))note=`En català s’escriu «${official}».`;
    else if(v.trim().toLowerCase().replace(/\s+/g,' ')!==official.toLowerCase())note=`Fixa’t en com s’escriu: «${official}».`;
    return {ok:true,note};
  }
  if(kind==='p'){const o=C.find(x=>x!==d&&pNames(x).includes(nv));if(o)return {other:`«${o.n}» és un altre país.`};
    const cc=C.find(x=>cNames(x).includes(nv));if(cc)return {other:`«${cc.cap}» és una capital, no un país.`}}
  else{const o=C.find(x=>x!==d&&cNames(x).includes(nv));if(o)return {other:`«${o.cap}» és la capital de ${o.n}.`};
    if(pNames(d).includes(nv)&&d.id!=='lu')return {other:'Has escrit el nom del país. Et demano la capital.'}}
  const lim=nv.length<=4?1:2;
  if(list.some(x=>lev(nv,x)<=lim))return {near:true};
  return {};
}

/* Col·loca països o capitals (arrossega els noms al mapa) */
function placeGame(kind){
  const items=pool();let placed=new Set(),errors=0,selected=null;
  const isC=kind==='c',label=d=>isC?d.cap:d.n;
  const sc=()=>scoreEl.innerHTML=`<span class="ok">✓ ${placed.size}/${items.length}</span><span class="bad">✗ ${errors}</span>`;
  const render=()=>{
    const left=shuffle(items.filter(d=>!placed.has(d.id)));sc();
    panel.innerHTML=`<div class="ph"><h2>${isC?'Col·loca les capitals':'Col·loca els països'}</h2>
      <p>${isC?'Arrossega cada capital fins al seu punt vermell (o a sobre del seu país).':'Arrossega cada nom fins al seu país.'} També pots tocar un nom i després tocar el país.</p>
      <div class="row">${zoneSelect()}</div>
      <div class="progress" aria-hidden="true"><span style="width:${placed.size/items.length*100}%"></span></div></div>
      <div class="pb">${left.length?`<div class="chips">${left.map(d=>`<span class="chip${isC?' capc':''}" data-id="${d.id}" role="button" tabindex="0">${esc(label(d))}</span>`).join('')}</div>`
        :`<div class="summary"><span class="eyebrow">Mapa complet</span><div class="big">${items.length}/${items.length}</div>
          <p>${errors===0?'Cap error. Perfecte!':`Ho has aconseguit amb ${errors} ${errors===1?'error':'errors'}.`}</p>
          <div class="row"><button class="btn primary" id="again">Torna-hi</button></div></div>`}
        <p class="muted">Consell: fes zoom per als països petits. Luxemburg i Malta tenen un cercle per tocar-los més fàcilment.</p></div>`;
    bindZone();
    const again=$('#again');if(again)again.onclick=()=>start(mode);
    panel.querySelectorAll('.chip').forEach(bindChip);
  };
  const tryPlace=(d,target,chipEl)=>{
    if(!target)return;
    if(target.id===d.id){
      placed.add(d.id);record(kind+':'+d.id,true);
      ctCls(d,'done',true);(isC?d.cap_:d.cl).classed('done',true);flash(d,'ok');
      toast(`Correcte: ${label(d)}`,'ok');selected=null;render();
    }else if(placed.has(target.id)){toast(isC?'Aquest país ja té la capital':'Aquest país ja té el nom');}
    else{errors++;record(kind+':'+d.id,false);flash(target,'bad');toast(isC?`${d.cap} no és a ${target.n}`:`Aquest país no és ${d.n}`,'bad');
      if(chipEl){chipEl.classList.remove('shake');void chipEl.offsetWidth;chipEl.classList.add('shake')}
      sc();}
  };
  // per a les capitals, el punt vermell més proper també compta
  const targetAt=(x,y)=>{
    if(isC){let best=null,bd=22;items.forEach(d=>{const r=d.cap_.select('.dot').node().getBoundingClientRect();const dist=Math.hypot(r.x+r.width/2-x,r.y+r.height/2-y);if(dist<bd){bd=dist;best=d}});if(best)return best}
    return countryAt(x,y);
  };
  const ghost=$('#ghost');
  function bindChip(c){
    const d=BY[c.dataset.id];let sx,sy,drag=false,hot=null;
    const setHot=n=>{if(n!==hot){if(hot){ctCls(hot,'hot',false);hot.cap_.classed('hot',false)}hot=n;if(hot){ctCls(hot,'hot',true);isC&&hot.cap_.classed('hot',true)}}};
    c.onpointerdown=e=>{e.preventDefault();sx=e.clientX;sy=e.clientY;drag=false;c.setPointerCapture(e.pointerId)};
    c.onpointermove=e=>{
      if(sx==null)return;
      if(!drag&&Math.hypot(e.clientX-sx,e.clientY-sy)>6){drag=true;ghost.innerHTML=c.innerHTML;ghost.className='chip ghost'+(isC?' capc':'');ghost.hidden=false;c.style.opacity=.35}
      if(drag){ghost.style.transform=`translate(${e.clientX-ghost.offsetWidth/2}px,${e.clientY-ghost.offsetHeight-14}px)`;setHot(targetAt(e.clientX,e.clientY))}
    };
    c.onpointerup=e=>{
      if(sx==null)return;sx=null;
      if(drag){ghost.hidden=true;c.style.opacity='';setHot(null);tryPlace(d,targetAt(e.clientX,e.clientY),c)}
      else{selected=selected===d?null:d;panel.querySelectorAll('.chip').forEach(x=>x.classList.toggle('sel',selected&&x.dataset.id===selected.id))}
    };
    c.onpointercancel=()=>{sx=null;ghost.hidden=true;c.style.opacity='';setHot(null)};
    c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selected=d;panel.querySelectorAll('.chip').forEach(x=>x.classList.toggle('sel',x===c))}};
  }
  onCountry=t=>{if(selected)tryPlace(selected,t,panel.querySelector(`.chip[data-id="${selected.id}"]`));else if(!placed.has(t.id))toast('Primer tria un nom de la llista')};
  render();
}

/* Motor comú de preguntes. Cada pregunta és {d: país, k: 'p' o 'c'} */
function quiz({title,intro,make,askFor,setup,extraHead,replay}){
  let queue=replay||make(),i=0,ok=0,ko=0,missed=[],locked=false;
  const showScore=()=>scoreEl.innerHTML=`<span class="ok">✓ ${ok}</span><span class="bad">✗ ${ko}</span>`;
  const next=()=>{
    clearMarks();locked=false;
    if(i>=queue.length)return finish();
    const q=queue[i];showScore();
    panel.innerHTML=`<div class="ph"><h2>${title}</h2><p>${intro}</p>${replay?'':`<div class="row">${zoneSelect()}${extraHead?extraHead():''}</div>`}
      <div class="progress" aria-hidden="true"><span style="width:${i/queue.length*100}%"></span></div></div>
      <div class="pb"><div class="ask"><span class="k">Pregunta ${i+1} de ${queue.length}</span>${askFor(q)}</div>
      <div id="qbody"></div><div class="fb" id="fb" aria-live="polite"></div>
      <div class="row"><button class="btn" id="skip">No ho sé</button><button class="btn primary" id="nextb" hidden>Següent</button></div></div>`;
    bindZone();
    const ks=$('#qkind');if(ks)ks.onchange=()=>{qKind=ks.value;start(mode)};
    $('#skip').onclick=()=>resolve(q,false,'');
    $('#nextb').onclick=()=>{i++;next()};
    setup(q,(good,extra)=>resolve(q,good,extra||''));
  };
  const resolve=(q,good,extra)=>{
    if(locked)return;locked=true;const d=q.d;
    record(q.k+':'+d.id,good);good?ok++:ko++;if(!good)missed.push(q);showScore();
    ctCls(d,'target',false);ctCls(d,'done',true);d.cl.classed('reveal',true);d.cap_.classed('reveal',true);
    const fb=$('#fb');fb.className='fb '+(good?'ok':'bad');
    const ans=q.k==='p'?d.n:d.cap;
    fb.innerHTML=(good?`Molt bé! És ${esc(ans)}.`:`Era ${esc(ans)}. Mira-ho al mapa.`)
      +`<small>${esc(d.n)} · capital: ${esc(d.cap)}${extra?'. '+esc(extra):''}</small>`;
    panel.querySelectorAll('#qbody input,#qbody button').forEach(x=>x.disabled=true);
    $('#skip').hidden=true;
    const nb=$('#nextb');
    if(good&&!extra)setTimeout(()=>{if(queue[i]===q&&locked){i++;next()}},reduce?800:1400);
    else{nb.hidden=false;nb.focus({preventScroll:true})}
  };
  const finish=()=>{
    const pct=Math.round(ok/queue.length*100);
    panel.innerHTML=`<div class="ph"><h2>${title}</h2><div class="row">${zoneSelect()}</div></div>
      <div class="pb"><div class="summary"><span class="eyebrow">Resultat</span><div class="big">${ok}/${queue.length}</div>
      <p>${pct===100?'Tot bé. Ja t’ho saps!':pct>=70?'Molt bé, ja quasi ho tens.':'Repassa els que has fallat i torna-hi.'}</p>
      ${missed.length?`<div><p class="muted">Has fallat:</p><div class="missed">${missed.map(q=>`<span>${esc(q.k==='p'?q.d.n:q.d.cap+' ('+q.d.n+')')}</span>`).join('')}</div></div>`:''}
      <div class="row">${missed.length?'<button class="btn primary" id="retry">Repeteix els fallats</button>':''}<button class="btn" id="again">Torna a començar</button></div></div></div>`;
    bindZone();
    $('#again').onclick=()=>start(mode);
    const r=$('#retry');if(r)r.onclick=()=>{const m=shuffle(missed);clearMarks();quiz({title,intro,make,askFor,setup,extraHead,replay:m})};
  };
  next();
  return {get locked(){return locked}};
}

/* Troba-ho: et dic un país o una capital i toques el país al mapa */
let qKind='p';
function findGame(){
  const r={};
  r.q=quiz({title:'Troba-ho al mapa',intro:'Toca el país al mapa.',
    make:()=>shuffle(pool()).map(d=>({d,k:qKind==='mix'?(Math.random()<.5?'p':'c'):qKind})),
    extraHead:()=>`<div class="field"><label for="qkind">Què et pregunto?</label><select id="qkind">
      <option value="p"${qKind==='p'?' selected':''}>Països</option><option value="c"${qKind==='c'?' selected':''}>Capitals</option><option value="mix"${qKind==='mix'?' selected':''}>Barrejat</option></select></div>`,
    askFor:q=>q.k==='p'?`<div class="q">${esc(q.d.n)}</div>`:`<div class="q">De quin país és la capital <span class="c">${esc(q.d.cap)}</span>?</div>`,
    setup:(q,done)=>{onCountry=t=>{if(r.q.locked)return;if(t.id===q.d.id){flash(t,'ok');done(true)}
      else{flash(t,'bad');t.cl.classed('reveal',true);setTimeout(()=>t.cl.classed('reveal',false),1500);done(false,`Has tocat ${t.n}`)}}}});
}

/* Escriu el país / Escriu la capital: el mapa marca un país i escrius la resposta sense opcions */
function typeGame(kind){
  const isC=kind==='c';
  quiz({title:isC?'Escriu la capital':'Escriu el país',
    intro:isC?'Mira el país marcat al mapa i escriu quina és la seva capital.':'Mira el país que s’encén al mapa i escriu com es diu. Compte amb l’ortografia i els accents.',
    make:()=>shuffle(pool()).map(d=>({d,k:kind})),
    askFor:q=>isC?`<div class="q">Quina és la capital de ${esc(q.d.n)}?</div>`:`<div class="q">Com es diu aquest país?</div>`,
    setup:(q,done)=>{
      const d=q.d;ctCls(d,'target',true);d.cap_.classed('target',true);
      if(isC)d.cl.classed('reveal',true);
      let tries=0,hint=0;const ans=isC?d.cap:d.n;
      $('#qbody').innerHTML=`<form class="tform" id="tf" autocomplete="off">
        <input type="text" id="ans" aria-label="${isC?'Capital':'Nom del país'}" placeholder="${isC?'Capital':'Nom del país'}" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button class="btn primary">Comprova</button></form>
        <div class="row" style="margin-top:10px"><button class="btn" type="button" id="hintb">Pista</button><span class="hint" id="hintv"></span></div>`;
      const inp=$('#ans'),fb=$('#fb');
      if(matchMedia('(pointer:fine)').matches)inp.focus({preventScroll:true});
      $('#hintb').onclick=()=>{
        const letters=[...ans].filter(c=>c!==' ').length;
        hint=Math.min(hint+1,letters-1);let k=0;
        $('#hintv').textContent=[...ans].map(c=>c===' '?'  ':(k++<hint?c:'_')).join(' ');
      };
      $('#tf').onsubmit=e=>{
        e.preventDefault();
        const r=check(d,kind,inp.value);
        if(r.empty){fb.className='fb near';fb.textContent='Escriu la resposta abans de comprovar.';return}
        if(r.ok)return done(true,r.note);
        if(r.near&&tries===0){tries++;fb.className='fb near';fb.textContent='Quasi! Revisa com s’escriu i torna-ho a provar.';inp.select();return}
        if(r.other&&tries===0&&r.other.startsWith('Has escrit el nom del país')){tries++;fb.className='fb near';fb.textContent=r.other;inp.select();return}
        done(false,r.other||`Has escrit «${inp.value.trim()}»`);
      };
    }});
}

/* De memòria: escriu els 27 països i les seves capitals */
function recallGame(){
  panel.innerHTML=`<div class="ph"><h2>De memòria</h2>
    <p>Escriu tots els països de la Unió Europea que recordis i la seva capital. L’ordre no importa.</p></div>
    <div class="pb"><form id="rf" autocomplete="off" class="recall">
      <div class="head"><span></span><span>País</span><span>Capital</span></div>
      ${C.map((_,i)=>`<div class="slot"><span class="n">${i+1}</span>
        <input type="text" id="rp-${i}" aria-label="País ${i+1}" autocapitalize="off" autocorrect="off" spellcheck="false">
        <input type="text" id="rc-${i}" aria-label="Capital ${i+1}" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
        <div class="why" id="rw-${i}"></div>`).join('')}
      <div class="fb" id="rfb" aria-live="polite"></div>
      <div class="sol" id="sol" hidden></div>
      <div class="row"><button class="btn primary">Comprova</button><button class="btn" type="button" id="showsol">Mostra les solucions</button><button class="btn" type="button" id="clear">Esborra-ho tot</button></div>
    </form></div>`;
  const run=()=>{
    clearMarks();let gp=0,gc=0;const used=new Set();
    C.forEach((_,i)=>{
      const ip=$(`#rp-${i}`),ic=$(`#rc-${i}`),w=$(`#rw-${i}`);
      [ip,ic].forEach(x=>x.classList.remove('ok','bad'));w.textContent='';
      if(!norm(ip.value)){if(norm(ic.value)){ic.classList.add('bad');w.textContent='Escriu també el país.'}return}
      const d=C.find(x=>!used.has(x.id)&&check(x,'p',ip.value).ok);
      if(!d){ip.classList.add('bad');
        const dup=C.find(x=>check(x,'p',ip.value).ok);
        w.textContent=dup?`${dup.n} ja l’has escrit.`:C.some(x=>check(x,'p',ip.value).near)?'Quasi! Revisa com s’escriu el país.':'Aquest país no és de la Unió Europea o està mal escrit.';
        if(norm(ic.value))ic.classList.add('bad');return}
      used.add(d.id);gp++;ip.classList.add('ok');ctCls(d,'done',true);d.cl.classed('done',true);record('p:'+d.id,true);
      const notes=[];const np=check(d,'p',ip.value).note;if(np)notes.push(np);
      if(!norm(ic.value)){ic.classList.add('bad');notes.push(`Falta la capital de ${d.n}.`)}
      else{const rc=check(d,'c',ic.value);
        if(rc.ok){gc++;ic.classList.add('ok');d.cap_.classed('done',true);record('c:'+d.id,true);if(rc.note)notes.push(rc.note)}
        else{ic.classList.add('bad');record('c:'+d.id,false);notes.push(rc.near?'Quasi! Revisa com s’escriu la capital.':rc.other||`Aquesta no és la capital de ${d.n}.`)}}
      w.textContent=notes.join(' ');
    });
    scoreEl.innerHTML=`<span class="ok">Països ${gp}/27</span><span class="ok">Capitals ${gc}/27</span>`;
    const fb=$('#rfb'),all=gp===27&&gc===27;fb.className='fb '+(all?'ok':'bad');
    fb.textContent=all?'Tots 27 països i capitals correctes. Perfecte!':`Tens ${gp} països i ${gc} capitals de 27. Al mapa en verd hi ha els que ja tens.`;
  };
  $('#rf').onsubmit=e=>{e.preventDefault();run()};
  $('#showsol').onclick=e=>{
    const show=e.target.dataset.on!=='1';e.target.dataset.on=show?'1':'';e.target.textContent=show?'Amaga les solucions':'Mostra les solucions';
    const s=$('#sol');s.hidden=!show;s.textContent=C.map(d=>`${d.n} (${d.cap})`).join(', ');
  };
  $('#clear').onclick=()=>{scoreEl.innerHTML='';clearMarks();recallGame()};
}

start('estudia');
</script>
